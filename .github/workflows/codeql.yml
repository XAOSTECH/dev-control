name: CodeQL

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
      - develop
  schedule:
    # Mon/Wed/Fri at 02:00 UTC — frequent enough for dashboard freshness, not every day
    - cron: '0 2 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          # Explicitly list languages present; auto-detect misses TypeScript in github-app/
          languages: javascript-typescript
          queries: security-and-quality
          config: |
            paths:
              - github-app/src
            paths-ignore:
              - node_modules
              - vendor
              - '.git'
              - 'vendor/bundle'
              - '.venv'
              - '__pycache__'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: true
          category: javascript-typescript

  # Security summary and reporting
  security-summary:
    name: Security Report
    runs-on: ubuntu-26.04
    needs: [analyze]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate security summary
        run: |
          echo "## 🔒 CodeQL Security Analysis Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Analysis Coverage:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Language**: TypeScript/JavaScript (github-app/src)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Query suite**: security-and-quality" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Schedule**: Mon/Wed/Fri 02:00 UTC + every push to main" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Runner**: ubuntu-26.04" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Complementary Security:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Shell scripts: bash-lint-advanced workflow (ShellCheck)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dockerfile: GitHub Advanced Security scanning" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Next Steps:" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Check the [Security tab](../../security/code-scanning?tab=alert) for results" >> "$GITHUB_STEP_SUMMARY"
          echo "2. Review any alerts in detail" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Address discovered vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[View CodeQL Documentation](https://codeql.github.com/docs/)" >> "$GITHUB_STEP_SUMMARY"
