name: Auto-Remediate

# Gate + remediate design:
# 1. gate job: on workflow_run, only proceeds when BOTH CodeQL and Bash-Lint
#    have completed on the same commit. Avoids acting on partial data.
# 2. 90s sleep: CodeQL results take ~90s to reach the alerts API after the
#    workflow marks complete; without this delay, 0 alerts are returned.
# 3. shfmt + ShellCheck diff-patches: deterministic safe fixes.
# 4. GitHub Models advisory: per-alert context read from the file; concise
#    fix hints land in the PR/issue body for human review.

on:
  workflow_run:
    workflows: ["CodeQL", "Bash Linting with Auto-Fix Suggestions"]
    types: [completed]
    branches: [main, master]
  schedule:
    - cron: '0 4 * * 2'
  workflow_dispatch:
    inputs:
      severity:
        description: 'Minimum alert severity (error/warning/note)'
        type: choice
        options: [error, warning, note]
        default: note
      dry_run:
        description: 'Preview without opening a PR'
        type: boolean
        default: false

permissions:
  contents: read
  security-events: read

concurrency:
  group: auto-remediate-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gate:
    name: Verify both scans completed
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check peer scan completed on same SHA
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" != "workflow_run" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA="${{ github.event.workflow_run.head_sha }}"
          THIS="${{ github.event.workflow.name }}"
          if [[ "$THIS" == "CodeQL" ]]; then
            PEER="Bash Linting with Auto-Fix Suggestions"
          else
            PEER="CodeQL"
          fi
          DONE=$(gh run list \
            --workflow "$PEER" --status success --limit 10 \
            --json headSha \
            --jq "[.[] | select(.headSha==\"$SHA\")] | length" 2>/dev/null || echo 0)
          if [[ "$DONE" -gt 0 ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Both scans complete on $SHA"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Peer ($PEER) not yet complete on $SHA — skipping"
          fi

  remediate:
    name: Collect findings and apply fixes
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      security-events: read
      issues: write

    steps:
      - name: Generate app token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.XB_CI }}
          private-key: ${{ secrets.XB_PK }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup bot identity
        id: identity
        uses: XAOSTECH/dev-control/.github/actions/identity@b067f72ca7f849b734a45634f23581a739d5146f # v2.0.0
        with:
          gpg-private-key: ${{ secrets.XB_GK }}
          gpg-passphrase: ${{ secrets.XB_GP }}
          user-token: ${{ secrets.XB_UT }}
          bot-name: ${{ vars.BOT_NAME || 'xaos-bot' }}

      - name: Wait for API ingestion
        if: github.event_name == 'workflow_run'
        run: sleep 90

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt jq

      - name: Apply ShellCheck diff-patches
        id: shellcheck
        run: |
          TOTAL=0; PATCHED=0
          while IFS= read -r script; do
            [[ -z "$script" ]] && continue
            issues=$(shellcheck -f json "$script" 2>/dev/null | jq 'length' || echo 0)
            TOTAL=$((TOTAL + issues))
            diff_out=$(shellcheck -f diff "$script" 2>/dev/null || true)
            if [[ -n "$diff_out" ]]; then
              echo "$diff_out" | patch -p1 -s 2>/dev/null && PATCHED=$((PATCHED + 1)) || true
            fi
          done < <(find . -type f -name "*.sh" ! -path "./.git/*" ! -path "./node_modules/*" ! -path "./vendor/*")
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "patched=$PATCHED" >> "$GITHUB_OUTPUT"
          echo "ShellCheck: $TOTAL issues, $PATCHED files patched"

      - name: Apply shfmt style fixes
        id: shfmt
        run: |
          FORMATTED=0
          while IFS= read -r script; do
            [[ -z "$script" ]] && continue
            if shfmt -d "$script" 2>/dev/null | grep -q .; then
              shfmt -i 4 -bn -ci -w "$script" 2>/dev/null && FORMATTED=$((FORMATTED + 1)) || true
            fi
          done < <(find . -type f -name "*.sh" ! -path "./.git/*" ! -path "./node_modules/*" ! -path "./vendor/*")
          echo "formatted=$FORMATTED" >> "$GITHUB_OUTPUT"
          echo "shfmt: $FORMATTED files reformatted"

      - name: Collect code-scanning alerts
        id: alerts
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          MIN="${{ github.event.inputs.severity || 'note' }}"
          case "$MIN" in
            error)   FILTER='select(.rule.severity=="error")' ;;
            warning) FILTER='select(.rule.severity=="error" or .rule.severity=="warning")' ;;
            *)       FILTER='.' ;;
          esac
          gh api "repos/${{ github.repository }}/code-scanning/alerts?state=open&per_page=100" \
            --jq "[.[] | $FILTER | {
              number:.number, rule:.rule.id, severity:.rule.severity,
              file:.most_recent_instance.location.path,
              line:.most_recent_instance.location.start_line,
              end_line:.most_recent_instance.location.end_line,
              message:.most_recent_instance.message.text
            }]" > /tmp/alerts.json 2>/dev/null || echo '[]' > /tmp/alerts.json
          COUNT=$(jq 'length' /tmp/alerts.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT open alert(s)"
          jq -r '.[] | "  [\(.severity)] \(.rule): \(.file):\(.line)"' /tmp/alerts.json 2>/dev/null || true

      - name: Apply pattern-based CodeQL fixes
        id: codeql_fixes
        run: |
          FIXED=0
          while IFS= read -r alert; do
            RULE=$(echo "$alert" | jq -r '.rule')
            FILE=$(echo "$alert" | jq -r '.file')
            [[ ! -f "$FILE" ]] && continue
            case "$RULE" in
              actions/unquoted-env*|actions/insecure-commands*)
                sed -i \
                  -e 's|>> \$GITHUB_OUTPUT|>> "$GITHUB_OUTPUT"|g' \
                  -e 's|>> \$GITHUB_ENV|>> "$GITHUB_ENV"|g' \
                  -e 's|>> \$GITHUB_STEP_SUMMARY|>> "$GITHUB_STEP_SUMMARY"|g' \
                  "$FILE" && FIXED=$((FIXED + 1)) || true
                ;;
            esac
          done < <(jq -c '.[]'  /tmp/alerts.json 2>/dev/null || true)
          echo "fixed=$FIXED" >> "$GITHUB_OUTPUT"
          echo "Pattern fixes: $FIXED"

      - name: Build alert summary with per-alert AI hints
        id: ai_hints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ALERT_LIST=$(jq -r '.[] | "- [\(.severity | ascii_upcase)] \(.rule) — \(.file):\(.line) — \(.message)"' \
            /tmp/alerts.json 2>/dev/null | head -20 || true)
          echo "alert_list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ALERT_LIST" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [[ -n "$ALERT_LIST" ]]; then
            # Include file context for the first few alerts
            CTX=""
            while IFS= read -r alert; do
              FILE=$(echo "$alert" | jq -r '.file')
              LINE=$(echo "$alert" | jq -r '.line')
              RULE=$(echo "$alert" | jq -r '.rule')
              [[ ! -f "$FILE" ]] && continue
              SNIP=$(sed -n "$((LINE > 3 ? LINE-3 : 1)),$((LINE+5))p" "$FILE" 2>/dev/null | head -10 | sed 's/^/    /')
              CTX="$CTX\nRule: $RULE at $FILE:$LINE\n$SNIP"
            done < <(jq -c '.[] | select(.line != null)' /tmp/alerts.json 2>/dev/null | head -5)

            PROMPT="GitHub Actions security expert. For each alert give a ONE-LINE fix. Include env: wrapping for script-injection.\n$ALERT_LIST\nContext:\n$CTX"
            AI_RESP=$(curl -fsSL -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              "https://models.inference.ai.azure.com/chat/completions" \
              -d "$(jq -n --arg p "$PROMPT" '{ model:"gpt-4o-mini", max_tokens:500, temperature:0.1, messages:[{role:"user",content:$p}]}')" \
              2>/dev/null | jq -r '.choices[0].message.content // "Review manually."' || echo "Models unavailable.")
            echo "hints<<EOF" >> "$GITHUB_OUTPUT"
            echo "$AI_RESP" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "has_changes=false" >> "$GITHUB_OUTPUT" || echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Open signed fix PR
        if: steps.changes.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ALERT_LIST: ${{ steps.ai_hints.outputs.alert_list }}
          AI_HINTS: ${{ steps.ai_hints.outputs.hints }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH="fix/auto-remediate-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -S -m "fix(security): apply ShellCheck, shfmt and CodeQL remediation"
          git push origin "$BRANCH"
          printf 'Automated fixes applied\n\nShellCheck patches: %s file(s) (%s issues)\nshfmt style: %s file(s)\nCodeQL patterns: %s\nOpen alerts: %s\n\n%s\n\nAI hints:\n%s\n\nhttps://github.com/%s/security/code-scanning\n' \
            "${{ steps.shellcheck.outputs.patched }}" \
            "${{ steps.shellcheck.outputs.total }}" \
            "${{ steps.shfmt.outputs.formatted }}" \
            "${{ steps.codeql_fixes.outputs.fixed }}" \
            "${{ steps.alerts.outputs.count }}" \
            "$ALERT_LIST" \
            "$AI_HINTS" \
            "$REPO" > /tmp/pr_body.md
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --title "Auto-Remediation: Security and Lint Fixes" \
            --body-file /tmp/pr_body.md \
            --label "security,automated,automerge"

      - name: Open tracking issue when nothing could be patched
        if: steps.changes.outputs.has_changes == 'false' && steps.alerts.outputs.count > 0
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ALERT_LIST: ${{ steps.ai_hints.outputs.alert_list }}
          AI_HINTS: ${{ steps.ai_hints.outputs.hints }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "security-review" --color "#e11d48" --description "Security alerts requiring manual review" --force 2>/dev/null || true
          OPEN=$(gh issue list --state open --label security-review --json number --jq 'length' 2>/dev/null || echo 0)
          [[ "$OPEN" -gt 0 ]] && { echo "Issue already open"; exit 0; }
          printf 'Open alerts for manual review\n\n%s\n\nAI hints:\n%s\n\nTip: Enable Copilot Autofix in Settings > Security > Code scanning for inline AI-generated fixes.\n\nhttps://github.com/%s/security/code-scanning\n' \
            "$ALERT_LIST" "$AI_HINTS" "$REPO" > /tmp/issue_body.md
          gh issue create \
            --title "Security Alerts Require Manual Review" \
            --label "security-review,help-wanted" \
            --body-file /tmp/issue_body.md
