name: Suppress CI Notifications
on:
  workflow_run:
    workflows:
      - Anglicise
      - Automerge
      - Auto-Remediate
      - Bash Linting
      - Bash Linting with Auto-Fix Suggestions
      - British English Spelling Check
      - CodeQL
      - Dependabot Auto-Label
      - Deploy to GitHub Pages
      - Git Tree Visualisation
      - Humanise Comments and Prose
      - Initialise Documentation
      - Initialise Repository Templates
      - Release
      - Repository Update
      - Rotate Bot GPG Key
      - Security Auto-Fix Bot
      - Sign Artefacts
      - Tests
      - Text Replacement
      - Validate PR for Automerge
    types: [completed]

permissions:
  contents: read

jobs:
  dismiss:
    # Always run so the self-cleanup step can dismiss stale suppress-notifications runs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub notification creation
        run: sleep 10

      - name: Dismiss triggered workflow's notification
        if: github.event.workflow_run.conclusion != 'failure'
        env:
          GH_TOKEN: ${{ secrets['US_UT'] }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          THREAD_ID=$(gh api "/notifications?per_page=100&all=true" \
            --jq ".[] | select(.subject.url | test(\"/${RUN_ID}$\")) | .id" | head -1)
          if [[ -n "$THREAD_ID" ]]; then
            gh api "/notifications/threads/${THREAD_ID}" -X PATCH -f state=done 2>/dev/null || true
            echo "Dismissed thread ${THREAD_ID} for run ${RUN_ID}"
          else
            echo "No notification found for run ${RUN_ID}"
          fi

      - name: Dismiss previous suppress-notifications runs
        if: always()
        env:
          GH_TOKEN: ${{ secrets['US_UT'] }}
        run: |
          NOTIFY_WF_ID=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows" \
            --jq '.workflows[] | select(.path | endswith("notify.yml")) | .id' | head -1 || echo "")
          if [[ -z "$NOTIFY_WF_ID" ]]; then
            echo "Could not resolve notify workflow ID"
            exit 0
          fi
          COUNT=0
          while IFS='|' read -r tid run_url; do
            run_id="${run_url##*/}"
            [[ "$run_id" =~ ^[0-9]+$ ]] || continue
            wf_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              --jq '.workflow_id // empty' 2>/dev/null || echo "")
            if [[ "$wf_id" == "$NOTIFY_WF_ID" ]]; then
              gh api "/notifications/threads/${tid}" -X PATCH -f state=done 2>/dev/null || true
              COUNT=$((COUNT + 1))
            fi
          done < <(gh api "/notifications?per_page=100&all=true" \
            --jq ".[] | select(.repository.full_name == \"${GITHUB_REPOSITORY}\" and .subject.type == \"WorkflowRun\") | \"\(.id)|\(.subject.url)\"")
          echo "Dismissed ${COUNT} suppress-notifications thread(s)"
