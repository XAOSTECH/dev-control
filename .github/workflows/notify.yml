name: Suppress CI Notifications
on:
  workflow_run:
    workflows:
      - Anglicise
      - Automerge
      - Auto-Remediate
      - Bash Linting
      - Bash Linting with Auto-Fix Suggestions
      - British English Spelling Check
      - CodeQL
      - Dependabot Auto-Label
      - Deploy to GitHub Pages
      - Git Tree Visualisation
      - Humanise Comments and Prose
      - Initialise Documentation
      - Initialise Repository Templates
      - Release
      - Repository Update
      - Rotate Bot GPG Key
      - Security Auto-Fix Bot
      - Sign Artefacts
      - Tests
      - Text Replacement
      - Validate PR for Automerge
    types: [completed]

permissions:
  contents: read

jobs:
  dismiss:
    # Only dismiss on non-failure — failures stay in the inbox as intended
    if: github.event.workflow_run.conclusion != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Dismiss notification for completed run
        env:
          GH_TOKEN: ${{ secrets['XB_UT'] }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          THREAD_ID=$(gh api "/notifications?per_page=100" \
            --jq ".[] | select(.subject.url | test(\"/${RUN_ID}$\")) | .id" \
            2>/dev/null | head -1)
          if [[ -n "$THREAD_ID" ]]; then
            gh api "/notifications/threads/${THREAD_ID}" -X PATCH -f state=done 2>/dev/null || true
          fi
