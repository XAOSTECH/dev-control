# GPG Key Configuration for xaos-bot GitHub App Bot
#
# Algorithm settings for the bot signing key. Identity (Name-Real / Name-Email) is resolved automatically by dc key from BOT_NAME and BOT_EMAIL in repoVars.env, so the BOT_ID placeholder below is only relevant when calling the legacy dc-gpg-setup path directly.
#
# To find the numeric GitHub user ID of xaos-bot[bot] for the legacy path:
#   gh api "/users/xaos-bot[bot]" --jq '.id'
#
# Recommended: run the full flow via dc key (see scripts/lib/keygen.sh):
#   dc key --bot           # interactive
#   dc key --bot --dry-run # preview only
#
# After generating, update repository secrets:
#   XB_GK  — the new GPG private key (armored)
#   XB_GP  — the new GPG passphrase
#
# SECURITY NOTE: the passphrase is auto-generated in memory and never stored in any file; both key and passphrase are written straight to GitHub Secrets via gh.

Key-Type: RSA
Key-Length: 4096
Name-Real: xaos-bot[bot]
Name-Email: BOT_ID+xaos-bot[bot]@users.noreply.github.com
Expire-Date: 1y
